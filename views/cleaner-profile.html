<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايل عامل النظافة - تيلكلين</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="font-sans bg-gray-100">

    <!-- Header Section -->
    <header class="bg-blue-600 text-white py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="text-2xl font-bold">TeleClean</div>
            <nav class="hidden md:flex space-x-4">
                <a href="/" class="hover:text-gray-300">الرئيسية</a>
                <a href="/about" class="hover:text-gray-300">من نحن</a>
                <a href="/service" class="hover:text-gray-300">الخدمات</a>
                <a href="/contact" class="hover:text-gray-300">اتصل بنا</a>
            </nav>
            <a href="/register" class="bg-white text-blue-600 px-4 py-2 rounded hover:bg-gray-200 hidden md:inline-block">استشارة مجانية</a>
        </div>
    </header>

    <!-- Cleaner Profile Section -->
    <section class="py-12 md:py-20">
        <div class="container mx-auto px-4">
            <h1 class="text-2xl md:text-3xl font-bold text-center mb-8">بروفايل عامل النظافة</h1>

            <!-- Form to Post a New Offer -->
            <div class="bg-white p-6 rounded shadow mb-8">
                <h2 class="text-xl font-bold mb-4">إضافة عرض جديد</h2>
                <form id="postOfferForm" class="space-y-4">
                    <input type="text" id="title" placeholder="عنوان العرض" class="w-full p-2 border rounded">
                    <textarea id="description" placeholder="وصف العرض" class="w-full p-2 border rounded"></textarea>
                    <input type="number" id="price" placeholder="السعر (DH)" class="w-full p-2 border rounded">
                    <input type="text" id="location" placeholder="الموقع" class="w-full p-2 border rounded">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 w-full">نشر العرض</button>
                </form>
            </div>

            <!-- List of Posted Offers -->
            <div id="postedOffers" class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold mb-4">العروض المنشورة</h2>
                <div id="offersList" class="space-y-4">
                    <!-- Offers will be dynamically loaded here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-10 text-center">
        <p>&copy; 2025 TeleClean - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        const userId = window.location.pathname.split("/").pop(); // Get user ID from URL
    
        // Function to load posted offers
        async function loadOffers() {
            try {
                const response = await fetch(`/cleaner-profile/${userId}/offers`);
                const data = await response.json();
    
                if (response.ok) {
                    const offersHtml = data.offers.map(offer => `
                        <div class="bg-gray-50 p-4 rounded shadow">
                            <h3 class="text-lg font-bold">${offer.title}</h3>
                            <p class="text-gray-700">${offer.description}</p>
                            <p class="text-gray-700">السعر: ${offer.price} DH</p>
                            <p class="text-gray-700">الموقع: ${offer.location}</p>
                        </div>
                    `).join("");
    
                    document.getElementById("offersList").innerHTML = offersHtml;
                } else {
                    alert("خطأ في تحميل العروض");
                }
            } catch (error) {
                alert("خطأ في الاتصال بالخادم");
            }
        }
    
        // Function to handle form submission
        document.getElementById("postOfferForm").addEventListener("submit", async (e) => {
            e.preventDefault();
    
            const title = document.getElementById("title").value;
            const description = document.getElementById("description").value;
            const price = document.getElementById("price").value;
            const location = document.getElementById("location").value;
    
            try {
                const response = await fetch(`/post-offer/${userId}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, description, price, location }),
                });
    
                if (response.ok) {
                    alert("تم نشر العرض بنجاح");
                    loadOffers(); // Reload the offers list
                } else {
                    alert("خطأ في نشر العرض");
                }
            } catch (error) {
                alert("خطأ في الاتصال بالخادم");
            }
        });
    
        // Load offers when the page loads
        loadOffers();
    </script>

</body>
</html>
